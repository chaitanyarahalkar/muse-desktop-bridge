title = "Muse Desktop Bridge"

[extend]
useDefault = true

[[rules]]
id = "muse-sdk-token"
description = "Muse Gadget SDK token"
regex = '''\bmgst_[A-Za-z0-9_-]{43}\b'''
entropy = 3.5

# Reviewed false positives in the unmodified, hash-verified upstream snapshot.
# Match exact synthetic vector values, rather than excluding the vendor tree.
[[allowlists]]
description = "Published synthetic pairing test vectors (scalars 1, 2, and 3)"
condition = "AND"
paths = ['''^muse-executor/vendor/muse-gadget-sdk/linux/tests/vectors/link_pairing_v5\.json$''']
regexTarget = "secret"
regexes = [
  '''^(7cf27b188d034f7e8a52380304b51ac3c08969e277f21b35a60b48fc47669978|765930feefbf68342aad90474f513ae108ad4b2764c0e10e94ff492b7790a474|ffe58d50a78cec08b78e220128da2f80913d66f865f24c14a4b21c00e2a96152|2208c6d80caa35cd71a5d89ae5f1bf0856e01def5a5e23c82aba926847631e0c|8479a24ffacec8df9dfdb7284bc686f8e73f791788967f058bb949df1d99b973|6bc3604a4762aa48c090784389446bcfecb5d9cea61ed392243326e77c9a34ff|28a230867831e8a154e116e542da131db1b9cdfbe2783ea9916a4b7f331c3bfb|560fa31813e6869852d75de6797b5a3221c2cfb5fddfefb87ceb7842d553e987|ee25e7f1eb3c05cc8465634e5f634deed858862b1c4c35fa434dc926f7facaeb|9abb2954b05e2f5f7112e9bfd41fd970602e27ed07453c1cff51f575de5d0b4e)$''',
]

[[allowlists]]
description = "Python type annotation, not a credential"
condition = "AND"
paths = ['''^muse-executor/vendor/muse-gadget-sdk/linux/src/musegadget/noise/noise_xx\.py$''']
regexTarget = "secret"
regexes = ['''^x25519\.X25519PrivateKey$''']
